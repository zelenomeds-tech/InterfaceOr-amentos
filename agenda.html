<style>
/* mesmo design system do painel de orçamentos */
:root{
  --mata:#0F3527; --mata-2:#0A2A1E; --mata-3:#164732;
  --folha:#2E7D5B; --folha-viva:#37946C;
  --brotinho:#DFF0E5; --brotinho-2:#EDF6EF;
  --papel:#F4F7F1; --branco:#FFFFFF;
  --tinta:#152019; --tinta-2:#54655A; --linha:#E0E8DE; --linha-2:#CFDCCF;
  --erro:#B3402E; --erro-fundo:#FBEDEA;
  --raio:16px; --raio-p:11px;
  --sombra:0 1px 2px rgba(15,53,39,.06), 0 10px 28px rgba(15,53,39,.09);
  --sombra-alta:0 2px 4px rgba(15,53,39,.08), 0 18px 44px rgba(15,53,39,.16);
  --display:'Bricolage Grotesque',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:var(--tinta);min-height:100dvh;
  background:
    radial-gradient(900px 500px at 105% -5%, #DFF0E566 0%, transparent 60%),
    radial-gradient(700px 460px at -10% 108%, #DFF0E54D 0%, transparent 55%),
    var(--papel)}
button{font-family:inherit;cursor:pointer}
.escondido{display:none!important}
:focus-visible{outline:2.5px solid var(--folha);outline-offset:2px;border-radius:6px}

.topo{position:sticky;top:0;z-index:30;overflow:hidden;background:linear-gradient(180deg,var(--mata-3),var(--mata));color:#fff;
  padding:15px 22px;display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.09) inset, 0 8px 24px rgba(10,42,30,.28)}
.topo::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.5px;
  background:linear-gradient(90deg,var(--folha-viva),#8FD3AC 30%,transparent 75%)}
.topo img{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px #ffffff22, 0 2px 8px rgba(0,0,0,.3)}
.topo b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.18em}
.topo span{margin-left:auto;font-size:12px;color:#9FCBB0}

.conteudo{max-width:720px;width:100%;margin:0 auto;padding:18px 22px 150px;
  animation:entra .28s cubic-bezier(.2,.8,.25,1) both}
@keyframes entra{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

.tituloSecao{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.015em;color:var(--mata);margin:12px 0 3px}
.tituloSecao::before{content:'Renovação de receita';display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.24em;text-transform:uppercase;color:var(--folha);margin-bottom:4px}
.subSecao{color:var(--tinta-2);font-size:14px;margin-bottom:16px}

/* cartão do médico — mesmo estilo do cabeçalho do cliente */
.cabMedico{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);
  padding:15px 17px;margin-bottom:16px;box-shadow:var(--sombra);display:flex;align-items:center;gap:14px}
.cabMedico .inicial{width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(145deg,var(--mata-3),var(--mata-2));color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;
  box-shadow:0 0 0 1.5px var(--linha), 0 0 0 4px var(--brotinho-2)}
.cabMedico .info{flex:1;min-width:0}
.cabMedico .info b{display:block;font-family:var(--display);font-size:16.5px;font-weight:800;letter-spacing:-.01em;color:var(--mata)}
.cabMedico .info span{display:block;font-size:12.5px;color:var(--tinta-2);margin-top:2px}
.cabMedico .selo{flex-shrink:0;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--folha);background:var(--brotinho-2);border:1px solid var(--brotinho);border-radius:999px;padding:6px 13px}

.olho{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--folha);margin:20px 0 10px}

/* dias — pílulas no estilo dos passos */
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.dia{flex:0 0 auto;background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:10px 16px;
  text-align:center;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s}
.dia:hover{border-color:var(--linha-2)}
.dia span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2)}
.dia b{display:block;font-family:var(--display);font-weight:800;font-size:16px;color:var(--mata);margin:1px 0}
.dia small{display:block;font-size:10.5px;color:var(--tinta-2)}
.dia.sel{background:linear-gradient(160deg,var(--mata-3),var(--mata));border-color:var(--mata);
  box-shadow:0 8px 20px rgba(15,53,39,.25)}
.dia.sel span,.dia.sel b,.dia.sel small{color:#fff}
.dia.sel small{color:#9FCBB0}

/* horários — mesma família dos cartões de produto */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.slot{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio-p);padding:12px 4px;text-align:center;
  font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--mata);
  transition:border-color .14s, background .14s, box-shadow .14s, transform .14s}
.slot:hover:not(.cheio):not(.sel){border-color:var(--folha);background:var(--brotinho-2);transform:translateY(-1px)}
.slot.sel{background:linear-gradient(180deg,var(--folha-viva),var(--folha));border-color:var(--folha);color:#fff;
  box-shadow:0 8px 18px rgba(46,125,91,.32)}
.slot.cheio{opacity:.35;cursor:default;text-decoration:line-through}

.msgErro{background:var(--erro-fundo);color:var(--erro);border:1px solid #E9C0B6;border-radius:12px;padding:11px 14px;font-size:14px;margin-top:14px;line-height:1.5}

/* cupom de confirmação — o recibo com picote do painel */
.cupom{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 14px calc(12px + env(safe-area-inset-bottom))}
.cupom .dentro{position:relative;max-width:692px;margin:0 auto;display:flex;align-items:center;gap:14px;
  background:var(--branco);border-radius:0 0 16px 16px;padding:14px 18px;
  box-shadow:0 -2px 0 var(--brotinho) inset, var(--sombra-alta)}
.cupom .dentro::before{content:'';position:absolute;left:0;right:0;top:-9px;height:10px;
  background:radial-gradient(circle at 5px 0, transparent 5px, var(--branco) 5.5px);
  background-size:14px 10px;background-position:center top}
.cupom .resumo{line-height:1.25;min-width:0}
.cupom .resumo span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--tinta-2);display:block}
.cupom .resumo b{font-family:var(--display);font-size:20px;color:var(--mata);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:12px;
  padding:14px 24px;font-size:15px;font-weight:800;margin-left:auto;
  background:linear-gradient(180deg,var(--folha-viva),var(--folha));color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 8px 18px rgba(46,125,91,.32);
  transition:transform .12s, box-shadow .15s, opacity .15s}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.5;cursor:default}

.carregando{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--tinta-2);padding:60px 0;font-size:14px}
.aro{width:20px;height:20px;border:2.5px solid var(--linha);border-top-color:var(--folha);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* sucesso — mesmo cartão com check animado do painel */
#telaSucesso{position:fixed;inset:0;z-index:75;background:#0F3527E8;backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:24px}
.sucessoCartao{background:#fff;border-radius:20px;padding:36px 40px;text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,.45);animation:surge .4s cubic-bezier(.2,.8,.25,1) both;max-width:420px}
@keyframes surge{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sucessoCartao b{display:block;font-family:var(--display);font-size:19px;color:var(--mata);margin-top:14px}
.sucessoCartao p{font-size:13.5px;color:var(--tinta-2);margin-top:6px;line-height:1.6}
.checkAnim{width:64px;height:64px;margin:0 auto;display:block}
.checkAnim circle{stroke:var(--brotinho);stroke-width:3;fill:none}
.checkAnim path{stroke:var(--folha);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:40;stroke-dashoffset:40;animation:risca .5s .15s cubic-bezier(.65,0,.45,1) forwards}
@keyframes risca{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <div class="olho">Horários</div>
    <div class="slots" id="slots"></div>

    <div class="msgErro escondido" id="erro"></div>
  </div>
</div>

<div class="cupom escondido" id="cupom">
  <div class="dentro">
    <div class="resumo"><span>Consulta</span><b id="cupomTexto">—</b></div>
    <button class="btn" id="btnConfirmar" disabled>Escolha um horário</button>
  </div>
</div>

<div id="telaSucesso" class="escondido">
  <div class="sucessoCartao">
    <svg class="checkAnim" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg>
    <b>Consulta agendada!</b>
    <p id="sucessoTexto"></p>
    <p style="margin-top:12px;font-size:12px">Pode fechar esta página. Qualquer imprevisto, fale com a equipe Zeleno.</p>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const chave = params.get('chave') || '';
const medico = params.get('medico') || '';
const contato = params.get('contato') || '';
let dados = null, diaSel = 0, horaSel = null;

function erroFatal(msg) {
  $('#carregando').innerHTML = msg + '<br><button class="btn" style="margin:16px auto 0" onclick="location.reload()">Tentar de novo</button>';
}

async function carregar() {
  try {
    const r = await fetch('/api/agenda?medico=' + encodeURIComponent(medico) + '&contato=' + encodeURIComponent(contato) + '&chave=' + encodeURIComponent(chave));
    const j = await r.json().catch(() => null);
    if (!j || !j.ok) { erroFatal((j && j.erro) || 'Não foi possível abrir a agenda (HTTP ' + r.status + ')'); return; }
    dados = j;
    $('#tSub').textContent = 'Escolha o melhor dia e horário' + (j.paciente ? ' para a consulta de ' + j.paciente.split(' ')[0] : '') + '.';
    $('#mIni').textContent = (j.medico.replace(/^dra?\.?\s*/i, '').trim().charAt(0) || 'M').toUpperCase();
    $('#mNome').textContent = j.medico;
    $('#mDet').textContent = (j.paciente ? 'Paciente: ' + j.paciente + ' · ' : '') + j.duracaoMin + ' min · horário de Brasília';
    $('#carregando').classList.add('escondido');
    $('#agenda').classList.remove('escondido');
    $('#cupom').classList.remove('escondido');
    desenharDias();
  } catch (e) { erroFatal('Falha de conexão — tente de novo.'); }
}

function desenharDias() {
  const box = $('#dias');
  box.innerHTML = dados.dias.map((d, i) => {
    const livres = d.slots.filter(s => s.livre).length;
    const [sem, num] = d.rotulo.split(' ');
    return '<div class="dia ' + (i === diaSel ? 'sel' : '') + '" data-i="' + i + '"><span>' + sem + '</span><b>' + num + '</b><small>' + livres + ' ' + (livres === 1 ? 'vaga' : 'vagas') + '</small></div>';
  }).join('');
  box.querySelectorAll('.dia').forEach(el => el.addEventListener('click', () => {
    diaSel = +el.dataset.i; horaSel = null;
    box.querySelectorAll('.dia').forEach(x => x.classList.toggle('sel', x === el));
    desenharSlots(); atualizarCupom();
  }));
  desenharSlots();
}

function desenharSlots() {
  const d = dados.dias[diaSel];
  $('#slots').innerHTML = d.slots.map(s =>
    '<div class="slot ' + (s.livre ? '' : 'cheio') + (s.hora === horaSel ? ' sel' : '') + '" data-h="' + s.hora + '">' + s.hora + '</div>').join('');
  $('#slots').querySelectorAll('.slot:not(.cheio)').forEach(el => el.addEventListener('click', () => {
    horaSel = el.dataset.h;
    $('#slots').querySelectorAll('.slot').forEach(x => x.classList.toggle('sel', x === el));
    atualizarCupom();
  }));
}

function atualizarCupom() {
  const b = $('#btnConfirmar');
  if (horaSel) {
    $('#cupomTexto').textContent = dados.dias[diaSel].rotulo + ' às ' + horaSel;
    b.disabled = false; b.textContent = 'Confirmar consulta';
  } else {
    $('#cupomTexto').textContent = '—';
    b.disabled = true; b.textContent = 'Escolha um horário';
  }
}

$('#btnConfirmar').addEventListener('click', async () => {
  const b = $('#btnConfirmar');
  b.disabled = true; b.textContent = 'Confirmando…';
  $('#erro').classList.add('escondido');
  try {
    const r = await fetch('/api/agendar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chave, medico, contato, data: dados.dias[diaSel].data, hora: horaSel }),
    });
    const j = await r.json().catch(() => null);
    if (!j || !j.ok) {
      $('#erro').textContent = (j && j.erro) || 'Não foi possível agendar (HTTP ' + r.status + ')';
      $('#erro').classList.remove('escondido');
      b.disabled = false; atualizarCupom();
      if (j && r.status === 409) carregar();
      return;
    }
    $('#sucessoTexto').textContent = (j.paciente || 'Paciente') + ' com ' + j.medico + ' — ' + dados.dias[diaSel].rotulo + ' às ' + j.hora + '. A consulta já está registrada.';
    $('#telaSucesso').classList.remove('escondido');
    $('#cupom').classList.add('escondido');
  } catch (e) {
    $('#erro').textContent = 'Falha de conexão — tente de novo.';
    $('#erro').classList.remove('escondido');
    b.disabled = false; atualizarCupom();
  }
});

if (!medico || !chave) erroFatal('Link incompleto — abra pelo botão "Agendar consulta" da interface Zeleno.');
else carregar();
</script>
</body>
</html>
